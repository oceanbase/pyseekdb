[project]
name = "pyseekdb"
version = "1.3.0"
description = "A unified Python client for seekdb that supports embedded, server, and OceanBase."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "OceanBase", email = "open_oceanbase@oceanbase.com" }]
requires-python = ">=3.11,<4"
classifiers = [
    "Development Status :: 4 - Beta",
]
dependencies = [
    "pymysql>=1.1.1",
    "pylibseekdb; sys_platform == \"linux\" or (sys_platform == \"darwin\" and platform_machine == \"arm64\")",
    "onnxruntime>=1.19.0; python_version < \"3.14\"",
    "tokenizers>=0.15.0; python_version < \"3.14\"",
    "httpx; python_version < \"3.14\"",
    "tqdm; python_version < \"3.14\"",
    "sentence-transformers; python_version >= \"3.14\"",
    "tenacity",
    "numpy>=1.26,!=2.4.0",
]

[project.urls]
Homepage = "https://www.seekdb.ai/"
Repository = "https://github.com/oceanbase/pyseekdb/"
"Bug Tracker" = "https://github.com/oceanbase/pyseekdb/issues"

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pylint>=3.2.7",
    "sphinx>=8.2.3",
    "sphinx-multiversion>=0.2.4",
    "sphinx-rtd-theme>=3.0.2",
    "myst-parser>=4.0.1",
    "prek>=0.2.17",
    "ruff>=0.11.5",
]

# Optional deps for unit tests. CI uses `uv run --no-sync pytest` so pip-installed deps persist.
unit-tests = [
    "bm25s[full]",
    "openai",
    "boto3",
    "litellm",
    "voyageai",
    "sentence-transformers>=5.0",
    "huggingface-hub>=0.26",
]

[tool.uv.workspace]
members = ["demo/rag"]

[tool.pdm.build]
source-includes = ["docs/", "examples/", "tests/"]
excludes = ["docs/_build/", "tests/seekdb.db/"]

[tool.pytest.ini_options]
log_level = "INFO"

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Long exception message
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S608"]
"src/pyseekdb/client/client_base.py" = ["S608"]

[tool.ruff.format]
preview = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
