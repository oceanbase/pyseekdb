name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - 'demo/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'

      - name: Cache prek
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run checks
        run: make check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'

      - name: Build package
        run: make build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          # Verify both sdist and wheel are created
          test -f dist/*.tar.gz || (echo "Source distribution not found" && exit 1)
          test -f dist/*.whl || (echo "Wheel not found" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  unit-test:
    runs-on: ubuntu-latest
    env:
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install depencies for unit tests
        run: |
          uv run pip install openai sentence-transformers torch torchvision torchaudio boto3 litellm voyageai

      - name: Sanity check embedding stack on Python 3.14
        if: matrix.python-version == '3.14'
        run: |
          set -euo pipefail
          uv run python -X faulthandler - <<'PY'
          import torch
          import sentence_transformers
          from pyseekdb import DefaultEmbeddingFunction
          from pyseekdb.client.embedding_function import dimension_of

          print("torch version:", torch.__version__)
          print("sentence_transformers version:", sentence_transformers.__version__)
          ef = DefaultEmbeddingFunction()
          print("default dimension:", ef.dimension)
          print("dimension_of(default):", dimension_of(ef))
          print("quick encode length:", len(ef(["sanity check"])[0]))
          PY

      - name: Run unit tests
        run: |
          if [ "${{ env.RUNNER_DEBUG }}" = "true" ]; then
            log_level=DEBUG
          else
            log_level=INFO
          fi
          set -o pipefail
          uv run pytest tests/unit_tests/ -v --log-cli-level=${log_level} | tee pytest.log
          tail -n 1 pytest.log | grep '=======' | grep 'passed' |grep -q 'failed' && exit 1 || exit 0

      - name: Diagnose non-db integration subset on Python 3.14
        if: matrix.python-version == '3.14'
        run: |
          set -o pipefail
          echo "Collect-only for non-db integration subset"
          uv run pytest tests/integration_tests/ --collect-only -q -k "not server and not embedded and not oceanbase" | tee collect_only.log

          echo "Run test_default_embedding_function::test_dimension_of"
          set +e
          uv run pytest tests/integration_tests/test_default_embedding_function.py::TestDefaultEmbeddingFunction::test_dimension_of -vv -s -o faulthandler_timeout=120 | tee diag_dimension_of.log
          code1=${PIPESTATUS[0]}
          echo "exit code (dimension_of): ${code1}"
          set -e
          if [ "${code1}" -ne 0 ]; then
            exit "${code1}"
          fi

          echo "Run test_detect_db_type_and_version::test_version_comparison"
          set +e
          uv run pytest tests/integration_tests/test_detect_db_type_and_version.py::TestDetectDbTypeAndVersion::test_version_comparison -vv -s -o faulthandler_timeout=120 | tee diag_version_comparison.log
          code2=${PIPESTATUS[0]}
          echo "exit code (version_comparison): ${code2}"
          set -e
          exit "${code2}"

      - name: Locate integration import side-effect culprit on Python 3.14
        if: matrix.python-version == '3.14'
        run: |
          set -euo pipefail
          base_a="tests/integration_tests/test_default_embedding_function.py"
          base_b="tests/integration_tests/test_detect_db_type_and_version.py"
          filter_expr="not server and not embedded and not oceanbase"

          echo "Baseline run (only two selected-file modules)"
          uv run pytest "${base_a}" "${base_b}" -v -k "${filter_expr}" --maxfail=1 >/dev/null

          echo "Probing additional integration modules for import side effects..."
          bad_files=()
          for f in tests/integration_tests/test_*.py; do
            if [ "${f}" = "${base_a}" ] || [ "${f}" = "${base_b}" ]; then
              continue
            fi
            set +e
            uv run pytest "${base_a}" "${base_b}" "${f}" -v -k "${filter_expr}" --maxfail=1 >/dev/null
            code=$?
            set -e
            if [ "${code}" -ne 0 ]; then
              echo "Potential culprit file: ${f} (exit code ${code})"
              bad_files+=("${f}:${code}")
            fi
          done

          if [ ${#bad_files[@]} -gt 0 ]; then
            echo "Detected files that trigger failure when included in collection:"
            printf '  - %s\n' "${bad_files[@]}"
            exit 1
          fi

          echo "No single-file culprit found; issue may require multi-file interaction."

      - name: Run integration tests without any test mode
        run: |
          if [ "${{ env.RUNNER_DEBUG }}" = "true" ]; then
            log_level=DEBUG
          else
            log_level=INFO
          fi
          set -o pipefail
          uv run pytest tests/integration_tests/ -v --log-cli-level=${log_level} -k "not server and not embedded and not oceanbase" | tee pytest.log
          pytest_exit=${PIPESTATUS[0]}
          echo "integration pytest exit code: ${pytest_exit}"
          exit ${pytest_exit}

  integration-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Allow other jobs to continue if one fails
      matrix:
        test_mode: [embedded, server, oceanbase]

    steps:
      - name: Free disk space
        uses: kfir4444/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'

      - name: Start OceanBase container
        if: matrix.test_mode == 'oceanbase'
        uses: oceanbase/setup-oceanbase-ce@v1
        with:
          image_name: 'oceanbase/oceanbase-ce'
          image_tag: '4.5.0.0-100000012025112711'
          mode: 'mini'
          sql_port: 10000
          datafile_size: '20G'
          log_disk_size: '10G'
          tenant_name: 'mysql'
          init_sql: "ALTER SYSTEM ob_vector_memory_limit_percentage = 30; create user 'jtuser'@'%'; GRANT SELECT, INSERT, UPDATE, DELETE ON test.* TO 'jtuser'@'%'; FLUSH PRIVILEGES;"

      - name: Start seekdb server container
        if: matrix.test_mode == 'server'
        run: |
          docker run --name seekdb-server -p 2881:2881 -d oceanbase/seekdb:1.0.0.0-100000262025111218
          sleep 15
          docker logs seekdb-server

      - name: Run integration tests for ${{ matrix.test_mode }}
        env:
          CI: 1
          SEEKDB_PATH: ${{ runner.temp }}/seekdb.db
          OB_PORT: 10000
          SERVER_PORT: 2881
        run: |
          # Run integration tests filtered by test mode
          if [ "${{ env.RUNNER_DEBUG }}" = "true" ]; then
            log_level=DEBUG
          else
            log_level=INFO
          fi
          set -o pipefail
          uv run pytest tests/integration_tests/ -v --log-cli-level=${log_level} -k "${{ matrix.test_mode }}" | tee pytest.log
          tail -n 1 pytest.log | grep '=======' | grep 'passed' | grep -q 'failed' && exit 1 || exit 0
