name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - 'demo/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'

      - name: Cache prek
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run checks
        run: make check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'

      - name: Build package
        run: make build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          # Verify both sdist and wheel are created
          test -f dist/*.tar.gz || (echo "Source distribution not found" && exit 1)
          test -f dist/*.whl || (echo "Wheel not found" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: |
          if [ "${{ env.RUNNER_DEBUG }}" = "true" ]; then
            log_level=DEBUG
          else
            log_level=INFO
          fi
          set -o pipefail
          uv run pytest tests/unit_tests/ -v --log-cli-level=${log_level} | tee pytest.log
          bash .github/scripts/check-pytest-summary.sh pytest.log

      - name: Run integration tests without any test mode
        run: |
          if [ "${{ env.RUNNER_DEBUG }}" = "true" ]; then
            log_level=DEBUG
          else
            log_level=INFO
          fi
          set -o pipefail
          uv run pytest tests/integration_tests/ -v --log-cli-level=${log_level} \
            -k "not server and not embedded and not oceanbase" | tee pytest.log
          bash .github/scripts/check-pytest-summary.sh pytest.log

  integration-test:
    # Build and test the CI-local embedded wheel on the same native image.
    runs-on: ${{ matrix.test_mode == 'embedded' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 180
    env:
      EMBEDDED_WHEEL_DIR: ${{ github.workspace }}/.embedded-wheel
    strategy:
      fail-fast: false  # Allow other jobs to continue if one fails
      matrix:
        include:
          - test_mode: embedded
            example_host: 127.0.0.1
            example_port: 2881
            example_tenant: sys
          - test_mode: server
            example_host: 127.0.0.1
            example_port: 2881
            example_tenant: sys
          - test_mode: oceanbase
            example_host: localhost
            example_port: 10000
            example_tenant: mysql

    steps:
      - name: Free disk space
        uses: kfir4444/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'

      - name: Restore exact embedded source wheel
        if: matrix.test_mode == 'embedded'
        id: embedded-wheel
        uses: actions/cache/restore@v4
        with:
          path: .embedded-wheel
          # Never reuse a wheel built from another source or build recipe.
          key: embedded-source-ubuntu22-x86_64-cp311-${{ hashFiles('.github/embedded-source.json', '.github/scripts/build-embedded-wheel.sh', '.github/scripts/embedded_wheel_manifest.py') }}

      - name: Install embedded source build dependencies
        if: matrix.test_mode == 'embedded' && steps.embedded-wheel.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 libaio1 libssl-dev zlib1g-dev

      - name: Build embedded wheel from pinned fixed sources
        if: matrix.test_mode == 'embedded' && steps.embedded-wheel.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-embedded-wheel.sh

      - name: Verify and install the exact embedded source wheel
        if: matrix.test_mode == 'embedded'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libaio1
          python .github/scripts/embedded_wheel_manifest.py verify .github/embedded-source.json "$EMBEDDED_WHEEL_DIR"
          uv pip install --python .venv/bin/python --no-deps --reinstall "$EMBEDDED_WHEEL_DIR"/*.whl
          .venv/bin/python .github/scripts/embedded_wheel_manifest.py installed .github/embedded-source.json "$EMBEDDED_WHEEL_DIR"

      - name: Save verified embedded source wheel
        if: matrix.test_mode == 'embedded' && steps.embedded-wheel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .embedded-wheel
          key: ${{ steps.embedded-wheel.outputs.cache-primary-key }}

      - name: Record embedded wheel provenance
        if: matrix.test_mode == 'embedded'
        uses: actions/upload-artifact@v4
        with:
          name: embedded-wheel-provenance
          include-hidden-files: true
          path: |
            .embedded-wheel/manifest.json
            .embedded-wheel/seekdb-version.txt
          if-no-files-found: error

      - name: Start OceanBase container
        if: matrix.test_mode == 'oceanbase'
        uses: oceanbase/setup-oceanbase-ce@v1
        with:
          image_name: 'oceanbase/oceanbase-ce'
          image_tag: '4.5.0.0-100000012025112711'
          mode: 'mini'
          sql_port: 10000
          datafile_size: '20G'
          log_disk_size: '10G'
          tenant_name: 'mysql'
          init_sql: "ALTER SYSTEM ob_vector_memory_limit_percentage = 30; create user 'jtuser'@'%'; GRANT SELECT, INSERT, UPDATE, DELETE ON test.* TO 'jtuser'@'%'; FLUSH PRIVILEGES;"

      - name: Start seekdb server container
        if: matrix.test_mode == 'server'
        run: |
          docker run --name seekdb-server -p 2881:2881 -d oceanbase/seekdb:1.0.0.0-100000262025111218
          sleep 15
          docker logs seekdb-server

      - name: Run integration tests for ${{ matrix.test_mode }}
        env:
          CI: 1
          SEEKDB_TEST_DATA_ROOT: ${{ github.workspace }}/.seekdb-test-data
          OB_PORT: 10000
          SERVER_PORT: 2881
        run: |
          # Run integration tests filtered by test mode
          if [ "${{ env.RUNNER_DEBUG }}" = "true" ]; then
            log_level=DEBUG
          else
            log_level=INFO
          fi
          set -o pipefail
          # Keep the verified source wheel; a normal uv sync would reinstall
          # the released pylibseekdb from uv.lock.
          uv run --no-sync pytest tests/integration_tests/ -v --log-cli-level=${log_level} \
            -k "${{ matrix.test_mode }}" | tee pytest.log
          bash .github/scripts/check-pytest-summary.sh pytest.log

      - name: Upload embedded database diagnostics
        if: always() && matrix.test_mode == 'embedded'
        uses: actions/upload-artifact@v4
        with:
          name: embedded-database-diagnostics
          include-hidden-files: true
          path: |
            .seekdb-test-data/
            pytest.log
          if-no-files-found: warn

      - name: Run examples for ${{ matrix.test_mode }}
        env:
          MODE: ${{ matrix.test_mode }}
          HOST: ${{ matrix.example_host }}
          PORT: ${{ matrix.example_port }}
          TENANT: ${{ matrix.example_tenant }}
          DATABASE: test
          SEEKDB_USER: root
        run: |
          for example_file in examples/*_example.py; do
            if [[ "$example_file" == "examples/namespace_example.py" ]]; then
              echo "Skipping ${example_file}: requires LakeBase 4.6.1+"
              continue
            fi

            echo "Testing ${example_file} in ${MODE} mode"
            if uv run python "$example_file"; then
              echo "${example_file} passed"
            else
              status=$?
              echo "${example_file} failed with exit code ${status}"
              exit "$status"
            fi
          done
